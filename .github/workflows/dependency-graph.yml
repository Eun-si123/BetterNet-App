name: Publish resolved Android dependency graph

# Trusted main only: a dependency submission needs contents: write and must
# never evaluate arbitrary fork-PR build scripts with that permission.
on:
  push:
    branches: [main]
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'app/build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/dependency-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: betternet-gradle-dependency-graph
  cancel-in-progress: true

jobs:
  submit:
    name: Submit resolved Gradle dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 for dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          for cli in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [[ -x "$cli" ]]; then
              "$cli" --install 'platforms;android-36' 'build-tools;35.0.0'
              exit $?
            fi
          done
          echo 'Android SDK command line tools not found' >&2
          exit 1
      - name: Submit Gradle wrapper's resolved dependency graph to GitHub
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          artifact-retention-days: 1
