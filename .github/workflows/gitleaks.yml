name: Gitleaks secret scan

# For PRs, run the workflow from the trusted base branch, not the PR.
# Never execute code or workflows supplied by an untrusted PR.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "22 3 * * 1" # Weekly full-history check (UTC).

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted policy from base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout proposed source as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: scan-source
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      # Respect the repository's Actions allowlist, even on repositories
      # that allow third-party actions. Verify official release bytes.
      - name: Download and verify official Gitleaks release
        shell: bash
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      # Use *trusted-base* ignores and the pinned built-in rules.
      # A PR cannot silence the scanner by editing its own .gitleaks files.
      - name: Scan PR Git history without executing PR code
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/gitleaks-trusted-defaults.toml"
          printf '%s\n' 'title = "Trusted Gitleaks defaults"' '[extend]' 'useDefault = true' > "$config"
          ignore="$RUNNER_TEMP/gitleaks-trusted.ignore"
          if [[ -f trusted-policy/.gitleaksignore ]]; then
            cp trusted-policy/.gitleaksignore "$ignore"
          else
            : > "$ignore"
          fi
          "$RUNNER_TEMP/gitleaks" git scan-source \
            --log-opts="--all" \
            --config "$config" \
            --gitleaks-ignore-path "$ignore" \
            --redact=100 --no-banner --log-level error
