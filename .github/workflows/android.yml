name: Android CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          for cli in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$cli" ]; then
              "$cli" --install "platforms;android-36" "build-tools;35.0.0"
              exit $?
            fi
          done
          echo "::error::Android command-line SDK tools are missing"
          exit 1
      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      # A0 manual testing: keep a short-lived, SHA-bound debug build accessible.
      # Never treat this as a signed release or an A1 connectivity result.
      - name: Record debug APK provenance and checksums
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd app/build/outputs/apk/debug
          printf 'source_commit=%s\nbuilt_commit=%s\nci_run=%s\n' \
            "$SOURCE_SHA" "$BUILT_SHA" "$RUN_URL" > BUILD_INFO.txt
          sha256sum app-debug.apk BUILD_INFO.txt > SHA256SUMS
      - name: Upload test-only debug APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: betternet-app-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/BUILD_INFO.txt
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
