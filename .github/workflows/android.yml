name: Android CI
on:
  workflow_dispatch: # Opt-in only: attest a fresh main APK build, not every CI run.
  pull_request:
    # A changed PR base must revalidate the new combined source tree.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Keep manual attestation independent of automatic main-push CI cancellation.
  group: betternet-android-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  change-scope:
    name: Change scope (fail open)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify full PR or push change range
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_changed_files.py
  docs:
    name: Markdown-only documentation validation
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'false' && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify docs and change-gate regressions
        run: |
          python3 -m unittest scripts.test_ci_changed_files -v
          python3 -m unittest discover -s scripts -p 'test_check_docs.py' -v
          python3 -m unittest scripts.test_ci_changed_files -v
          python3 scripts/check_docs.py

  build:
    needs: change-scope
    # Skip cosmetic PR edits; only a base change merits another build.
    if: needs.change-scope.outputs.heavy == 'true' && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate local documentation and checker regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_docs.py' -v
          python3 scripts/check_docs.py
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      # Cache verified Gradle artifacts across runs; reduce repeated remote
      # Maven fetches on hourly development CI and rate-limit exposure.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android SDK packages
        shell: bash
        run: |
          for cli in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$cli" ]; then
              "$cli" --install "platforms;android-36" "build-tools;35.0.0"
              exit $?
            fi
          done
          echo "::error::Android command-line SDK tools are missing"
          exit 1
      - name: Test and build
        shell: bash
        run: |
          # Retry ONLY Maven repository HTTP 429; a compilation, Lint, test
          # or other build failure must remain an immediate hard failure.
          set -o pipefail
          build_log="$(mktemp)"
          trap 'rm -f "$build_log"' EXIT
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee "$build_log"; then
              exit 0
            fi
            if (( attempt == 3 )) || ! grep -Eq 'Received status code 429|Too Many Requests' "$build_log"; then
              exit 1
            fi
            echo "::warning::Maven repository returned HTTP 429; retrying after backoff ($attempt/3)"
            sleep $((attempt * 30))
            : > "$build_log"
          done
          exit 1
      - name: Verify actual app debug and release runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.test_check_runtime_security_deps -v
          # Use the already resolved Gradle cache from the passing APK build;
          # do not let a Maven outage hide what actually ships in the app.
          for config in debugRuntimeClasspath releaseRuntimeClasspath; do
            ./gradlew --offline --no-daemon :app:dependencies --configuration "$config" > "$RUNNER_TEMP/$config.txt"
            python3 scripts/check_runtime_security_deps.py "$config" < "$RUNNER_TEMP/$config.txt"
          done
      - name: Test APK secret scanner fixtures and inspect built artifact
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_apk_secrets.py' -v
          python3 scripts/check_apk_secrets.py app/build/outputs/apk/debug/app-debug.apk
      # A0 manual testing: keep a short-lived, SHA-bound debug build accessible.
      # Never treat this as a signed release or an A1 connectivity result.
      - name: Record debug APK provenance and checksums
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd app/build/outputs/apk/debug
          printf 'source_commit=%s\nbuilt_commit=%s\nci_run=%s\n' \
            "$SOURCE_SHA" "$BUILT_SHA" "$RUN_URL" > BUILD_INFO.txt
          sha256sum app-debug.apk BUILD_INFO.txt > SHA256SUMS
          bash "$GITHUB_WORKSPACE/scripts/verify-debug-apk.sh" . "$SOURCE_SHA" "$BUILT_SHA"
      - name: Upload test-only debug APK
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: betternet-app-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/BUILD_INFO.txt
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Verify and attest manually requested debug APK
    needs: [change-scope, build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the APK from the *same* successful workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: betternet-app-debug-${{ github.sha }}
          path: ${{ runner.temp }}/apk-for-attestation
      - name: Recheck APK checksums and exact main commit provenance
        shell: bash
        env:
          ARTIFACT_PATH: ${{ runner.temp }}/apk-for-attestation
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/verify-debug-apk.sh "$ARTIFACT_PATH" "$EXPECTED_COMMIT" "$EXPECTED_COMMIT"
      # GitHub recommends attestations for distributable binaries, not every
      # short-lived PR/test build. A manual main dispatch is an explicit opt-in.
      # This is an unsigned *debug* APK with build provenance, NOT an app
      # release signature, runtime integrity guarantee or production approval.
      - name: Attest debug APK build origin
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/apk-for-attestation/app-debug.apk
