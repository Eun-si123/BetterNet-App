name: Android CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          for cli in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$cli" ]; then
              "$cli" --install "platforms;android-36" "build-tools;35.0.0"
              exit $?
            fi
          done
          echo "::error::Android command-line SDK tools are missing"
          exit 1
      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
