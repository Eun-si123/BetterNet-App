name: Bootstrap Gradle verified dependency checksums (review only)
on:
  pull_request:
    paths:
      - ".github/workflows/gradle-verification-bootstrap.yml"
      - "gradle/verification-metadata.xml"
permissions:
  contents: read
concurrency:
  group: gradle-verification-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  generate:
    name: Generate reviewable SHA-256 metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout proposed sources without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate official Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Initialize read-only Gradle cache
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          for cli in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [[ -x "$cli" ]]; then
              "$cli" --install "platforms;android-36" "build-tools;35.0.0"
              exit $?
            fi
          done
          exit 1
      - name: Build tests, lint and APK while generating checksum allowlist
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --write-verification-metadata sha256 :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
          test -s gradle/verification-metadata.xml
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path("gradle/verification-metadata.xml")
          r = ET.parse(p).getroot()
          ns = "{https://schema.gradle.org/dependency-verification}"
          modules = r.find(ns+"components")
          assert modules is not None and len(list(modules)) > 20
          assert len(r.findall(".//"+ns+"sha256")) > 40
          assert not r.findall(".//"+ns+"trusted-artifacts")
          print("Generated checksum review artifact", len(list(modules)), "components")
          PY
      - name: Upload checksum metadata only for human review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proposed-gradle-verification-${{ github.sha }}
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1
