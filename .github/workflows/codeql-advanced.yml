name: CodeQL security analysis (Android, Actions and Python)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 3 * * 3'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: betternet-codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  change-scope:
    name: Change scope (fail open)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify full PR or push change range
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_changed_files.py
  analyze:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    permissions:
      contents: read
      security-events: write
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Configure Gradle cache
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Install Android SDK 36
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          for cli in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [[ -x "$cli" ]]; then
              "$cli" --install 'platforms;android-36' 'build-tools;35.0.0'
              exit $?
            fi
          done
          echo 'Android SDK command-line tools were not found' >&2
          exit 1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile Android app with CodeQL tracing
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Analyze source and upload security results
        uses: github/codeql-action/analyze@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4
        with:
          category: '/language:${{ matrix.language }}'
