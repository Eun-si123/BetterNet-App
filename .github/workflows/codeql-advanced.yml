name: CodeQL security analysis (Android, Actions and Python)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 3 * * 3'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: betternet-codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@v4
      - name: Configure Gradle cache
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true
      - name: Install Android SDK 36
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          for cli in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [[ -x "$cli" ]]; then
              "$cli" --install 'platforms;android-36' 'build-tools;35.0.0'
              exit $?
            fi
          done
          echo 'Android SDK command-line tools were not found' >&2
          exit 1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile Android app with CodeQL tracing
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Analyze source and upload security results
        uses: github/codeql-action/analyze@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4
        with:
          category: '/language:${{ matrix.language }}'
