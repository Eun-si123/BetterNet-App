version: 2
updates:
  # Review grouped CI upgrades in one PR instead of multiplying Actions runs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    # Major version upgrades require a separate compatibility migration.
    # This filters VERSION proposals, not urgent Dependabot security updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # A proposal is not approval: Android Gradle/AGP/Kotlin compatibility must
  # still pass Android CI and security analysis before merge.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:40"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    # Major version upgrades require a separate compatibility migration.
    # This filters VERSION proposals, not urgent Dependabot security updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
